# Tient les routes réelles à jour toutes seules.
#
# Le tracé du site suit la route entre deux points GPS grâce aux géométries
# précalculées dans src/routes.json. Chaque nouveau point de l'équipage crée une
# paire absente du cache, qui retombe en ligne droite : la carte se dégrade donc
# toute seule au fil du voyage tant que personne ne relance le calcul.
#
# Ce job le relance à intervalle régulier et ne commite QUE s'il a trouvé
# quelque chose. Aucune clé n'est nécessaire : fetch_routes.py lit Firestore par
# ses chemins publics et interroge un routeur public.
name: routes

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, décalé pour éviter l'heure pile
  workflow_dispatch:          # et à la demande depuis l'onglet Actions

# Une seule exécution à la fois : deux jobs qui poussent en même temps se
# marcheraient dessus.
concurrency:
  group: routes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recalculer les données du voyage
        run: python src/parse_csv.py

      - name: Router les nouveaux segments
        # Non bloquant : sans réseau ou si le routeur est indisponible, on garde
        # les routes déjà connues et les nouveaux segments restent droits.
        continue-on-error: true
        run: python src/fetch_routes.py

      - name: Photographier l'historique Firestore
        # Non bloquant : quota epuise (429) ou reseau coupe -> on garde
        # l'instantane deja publie et on reessaie au tour suivant.
        continue-on-error: true
        run: python src/fetch_tracks.py

      - name: Régénérer le site
        run: python src/build.py

      - name: Publier si quelque chose a changé
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="src/routes.json src/data.json index.html voyage-afrique.html version.json"
          # L'instantane peut manquer : quota epuise au premier tour, ou
          # etape non bloquante qui a echoue. `git add` sur un fichier
          # absent fait echouer tout le job — on ne l'ajoute que s'il est la.
          [ -f src/tracks.json ] && FILES="$FILES src/tracks.json"
          if git diff --quiet -- $FILES; then
            echo "Aucune nouvelle route — rien à publier."
            exit 0
          fi
          git add -- $FILES
          ROUTES=$(python -c "import json;print(len(json.load(open('src/routes.json'))))")
          SNAP=$(python -c "import json,os;p='src/tracks.json';print(sum(len(v) if isinstance(v,list) else sum(len(x) for x in v.values()) for v in json.load(open(p)).values()) if os.path.exists(p) else 0)")
          git commit -m "Routes: ${ROUTES} géométries, instantané ${SNAP} documents"
          # Quelqu'un a pu pousser entre-temps : on se replace avant d'envoyer.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
