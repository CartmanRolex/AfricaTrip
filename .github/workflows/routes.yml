# Tient les routes réelles à jour toutes seules.
#
# Le tracé du site suit la route entre deux points GPS grâce aux géométries
# précalculées dans src/routes.json. Chaque nouveau point de l'équipage crée une
# paire absente du cache, qui retombe en ligne droite : la carte se dégrade donc
# toute seule au fil du voyage tant que personne ne relance le calcul.
#
# Ce job le relance à intervalle régulier et ne commite QUE s'il a trouvé
# quelque chose. Aucune clé n'est nécessaire : fetch_routes.py lit Firestore par
# ses chemins publics et interroge un routeur public.
name: routes

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, décalé pour éviter l'heure pile
  workflow_dispatch:          # et à la demande depuis l'onglet Actions

# Une seule exécution à la fois : deux jobs qui poussent en même temps se
# marcheraient dessus.
concurrency:
  group: routes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recalculer les données du voyage
        run: python src/parse_csv.py

      - name: Router les nouveaux segments
        # Non bloquant : sans réseau ou si le routeur est indisponible, on garde
        # les routes déjà connues et les nouveaux segments restent droits.
        continue-on-error: true
        run: python src/fetch_routes.py

      - name: Photographier l'historique Firestore
        # Non bloquant : quota epuise (429) ou reseau coupe -> on garde
        # l'instantane deja publie et on reessaie au tour suivant.
        continue-on-error: true
        run: python src/fetch_tracks.py

      - name: Régénérer le site
        run: python src/build.py

      # Précalcule les recollages de route en faisant tourner LE VRAI SITE sans
      # écran. Sans ça, chaque visiteur refait 85 millions de calculs de
      # distance pour aboutir aux mêmes 19 Ko — 4,9 s de processeur, 14 s de
      # chargement sur un téléphone.
      #
      # Non bloquant, et volontairement : si Puppeteer ou Chrome fait défaut,
      # le site retombe sur le calcul côté client. Plus lent, mais juste.
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: "20"
          cache: npm
      - name: Précalculer les recollages de route
        continue-on-error: true
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node src/collect_tweens.mjs
          python src/build.py

      - name: Publier si quelque chose a changé
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="src/routes.json src/data.json index.html voyage-afrique.html version.json"
          # Les recollages precalcules : absents si l'etape non bloquante a
          # echoue, on ne les ajoute donc que s'ils sont la.
          [ -f src/tweens.json ] && FILES="$FILES src/tweens.json"
          # L'instantane peut manquer : quota epuise au premier tour, ou
          # etape non bloquante qui a echoue. `git add` sur un fichier
          # absent fait echouer tout le job — on ne l'ajoute que s'il est la.
          [ -f src/tracks.json ] && FILES="$FILES src/tracks.json"
          if git diff --quiet -- $FILES; then
            echo "Aucune nouvelle route — rien à publier."
            exit 0
          fi
          git add -- $FILES
          ROUTES=$(python -c "import json;print(len(json.load(open('src/routes.json'))))")
          # Compter les COLLECTIONS nommement : tracks.json porte aussi des
          # curseurs de rattrapage, et un `for v in .values()` generique
          # trebuche dessus.
          SNAP=$(python -c "import json,os;p='src/tracks.json';d=json.load(open(p)) if os.path.exists(p) else {};print(len(d.get('chunks',[]))+len(d.get('photos',[]))+len(d.get('positions',[]))+sum(len(x) for x in d.get('v1',{}).values()))")
          git commit -m "Routes: ${ROUTES} géométries, instantané ${SNAP} documents"
          # Quelqu'un a pu pousser entre-temps : on se replace avant d'envoyer.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # EN DERNIER, et volontairement bloquant. La publication a deja eu lieu
      # au-dessus, donc echouer ici ne prive le site de rien : ca sert
      # uniquement a envoyer le mail « build failed ».
      #
      # Une surcharge `vehicle_from` prime sur ce que l'appli enregistre, et
      # n'a ni fin ni surveillance : Hugo et Paul ont echange une nuit puis
      # sont revenus, et le site les a affiches intervertis pendant deux jours
      # alors que le telephone de Paul disait le contraire depuis le lendemain
      # matin. Une surcharge muette gagne meme quand elle a tort. Ce controle
      # ne corrige rien — l'equipage seul sait qui roule ou — il rend
      # seulement impossible de ne pas s'en apercevoir.
      # Python et le site ont chacun leur copie des calculs de base — on ne
      # partage pas de code entre les deux mondes. Faute de pouvoir les unifier,
      # on leur interdit de diverger. Ce contrôle a trouvé un défaut réel dès
      # son premier passage.
      - name: Vérifier que Python et le site sont d'accord
        run: python src/check_accord.py

      - name: Vérifier que les surcharges disent encore la vérité
        run: python src/check_overrides.py
